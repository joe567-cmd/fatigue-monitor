<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>基于MediaPipe的面部疲劳监测系统</title>
<style>*{ margin: 0; padding: 0; box-sizing: border-box; }
:root{ --primary: #1a1a2e; --secondary: #16213e; --accent: #00d4ff; --accent-dim: #0088aa; --success: #00ff88; --warning: #ffaa00; --danger: #ff4466; --text: #e8f4f8; --text-dim: #8899aa; --glass: rgba(22,33,62,0.85); --card-bg: #1e2745; }
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--primary);color:var(--text);min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}
#homeScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)}
